name: CI
on:
  push:
    branches: [main]
  pull_request: 
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v5
    - name: node-setup
      uses: actions/setup-node@v5
      with: 
          node-version: 24
          cache: npm
    - name: Install dependencies
      run: npm ci
    - name: no type errors
      run: npx tsc --noEmit
    - name: Testing
      run: npm test
    - name: Build server
      run: npm run build