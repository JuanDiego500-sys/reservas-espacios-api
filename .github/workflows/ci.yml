name: CI
on:
  push:
    branches: [main]
  pull_request: 
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v5
    - name: node-setup
      uses: actions/setup-node@v5
      with: 
          node-version: 24
          cache: npm
    - name: Install dependencies
      run: npm ci
    - name: no type errors
      run: npx tsc --noEmit
    - name: Testing
      run: npm test
    - name: Build server
      run: npm run build

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: checkout
      uses: actions/checkout@v5
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
          context: .
          push: true
          tags: |
            ghcr.io/juandiego500-sys/reservas-espacios-api:latest
            ghcr.io/juandiego500-sys/reservas-espacios-api:${{ github.sha }}