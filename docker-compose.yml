services:
  db:
    image: postgres:17
    ports:
      # Puerto de Windows : puerto del contenedor. Se usa 55432 afuera para no chocar
      # con un PostgreSQL instalado localmente, que suele ocupar el 5432 o el 5433.
      - "55432:5432"
    environment:
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
      POSTGRES_DB: reservas
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
